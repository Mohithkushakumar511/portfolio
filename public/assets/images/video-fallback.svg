<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1920 1080" width="100%" height="100%">
  <defs>
    <radialGradient id="fallBg" cx="50%" cy="40%" r="70%">
      <stop offset="0%" stop-color="#1a1510"/>
      <stop offset="50%" stop-color="#100e0c"/>
      <stop offset="100%" stop-color="#0a0a0a"/>
    </radialGradient>
    <radialGradient id="centerGlow" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#590907" stop-opacity="0.18"/>
      <stop offset="60%" stop-color="#a5a79b" stop-opacity="0.04"/>
      <stop offset="100%" stop-color="transparent"/>
    </radialGradient>
    <filter id="blur1">
      <feGaussianBlur stdDeviation="40"/>
    </filter>
  </defs>
  <rect width="1920" height="1080" fill="url(#fallBg)"/>
  <rect width="1920" height="1080" fill="url(#centerGlow)"/>
  <!-- Abstract geometric lines -->
  <g stroke="#a5a79b" stroke-opacity="0.06" stroke-width="1" fill="none">
    <line x1="0" y1="270" x2="1920" y2="270"/>
    <line x1="0" y1="540" x2="1920" y2="540"/>
    <line x1="0" y1="810" x2="1920" y2="810"/>
    <line x1="480" y1="0" x2="480" y2="1080"/>
    <line x1="960" y1="0" x2="960" y2="1080"/>
    <line x1="1440" y1="0" x2="1440" y2="1080"/>
  </g>
  <!-- Atmospheric glow blobs -->
  <ellipse cx="960" cy="400" rx="600" ry="300" fill="#590907" fill-opacity="0.08" filter="url(#blur1)"/>
  <ellipse cx="400" cy="800" rx="300" ry="200" fill="#a5a79b" fill-opacity="0.04" filter="url(#blur1)"/>
  <ellipse cx="1500" cy="200" rx="250" ry="150" fill="#590907" fill-opacity="0.06" filter="url(#blur1)"/>
</svg>

