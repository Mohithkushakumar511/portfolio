<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 1000" width="100%" height="100%">
  <defs>
    <radialGradient id="bgGlow" cx="50%" cy="40%" r="65%">
      <stop offset="0%" stop-color="#1f1a18" />
      <stop offset="60%" stop-color="#121010" />
      <stop offset="100%" stop-color="#0a0a0a" />
    </radialGradient>
    <linearGradient id="burgundySheen" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#e8d2b5" />
      <stop offset="40%" stop-color="#a5a79b" />
      <stop offset="75%" stop-color="#590907" />
      <stop offset="100%" stop-color="#2a0504" />
    </linearGradient>
    <filter id="cinematicGlow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="24" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>

  <!-- Deep Obsidian Canvas -->
  <rect width="800" height="1000" fill="url(#bgGlow)" />

  <!-- Abstract Geometry & Framing -->
  <circle cx="400" cy="420" r="280" fill="none" stroke="#a5a79b" stroke-opacity="0.12" stroke-width="1.5" stroke-dasharray="6 8" />
  <circle cx="400" cy="420" r="240" fill="none" stroke="#590907" stroke-opacity="0.22" stroke-width="1" />
  
  <!-- Subtle Ethereal Ambient Aura -->
  <circle cx="400" cy="380" r="160" fill="#590907" fill-opacity="0.10" filter="url(#cinematicGlow)" />

  <!-- Stylized Elegant Editorial Developer Silhouette -->
  <g transform="translate(400, 480)">
    <!-- Shoulders & Torso -->
    <path d="M-200,380 C-180,240 -120,200 -40,180 L40,180 C120,200 180,240 200,380 Z" fill="#171515" stroke="url(#burgundySheen)" stroke-width="1.5" />
    <!-- Collar & Lapel accents -->
    <path d="M-40,180 L0,270 L40,180" fill="none" stroke="#a5a79b" stroke-width="1.5" stroke-opacity="0.5"/>
    <!-- Neck -->
    <path d="M-32,180 L-32,120 L32,120 L32,180 Z" fill="#1c1818" />
    <!-- Head & Contours -->
    <path d="M-60,70 C-60,-40 -40,-85 0,-85 C40,-85 60,-40 60,70 C60,115 35,145 0,145 C-35,145 -60,115 -60,70 Z" fill="#181515" stroke="url(#burgundySheen)" stroke-width="1.5"/>
    <!-- Modern Sculpted Hairline -->
    <path d="M-62,20 C-65,-60 -35,-95 0,-95 C35,-95 65,-60 62,20 C50,-20 30,-50 0,-50 C-30,-50 -50,-20 -62,20 Z" fill="#0c0a0a" />
    
    <!-- Sophisticated Ambient Rim Light -->
    <path d="M58,20 C58,-40 40,-80 0,-82" fill="none" stroke="#e8d2b5" stroke-width="2.5" stroke-linecap="round" filter="url(#cinematicGlow)" />
  </g>

  <!-- Luxury Corner Framing Brackets -->
  <path d="M 40,80 L 40,40 L 80,40" fill="none" stroke="#590907" stroke-width="2" />
  <path d="M 760,80 L 760,40 L 720,40" fill="none" stroke="#590907" stroke-width="2" />
  <path d="M 40,920 L 40,960 L 80,960" fill="none" stroke="#590907" stroke-width="2" />
  <path d="M 760,920 L 760,960 L 720,960" fill="none" stroke="#590907" stroke-width="2" />

  <!-- Editorial Typography Watermark -->
  <text x="400" y="880" font-family="'Cinzel', Georgia, serif" font-size="18" letter-spacing="8" fill="#e8d2b5" text-anchor="middle" font-weight="600">MOHITH KUSHA KUMAR</text>
  <text x="400" y="910" font-family="'Plus Jakarta Sans', sans-serif" font-size="12" letter-spacing="4" fill="#a5a79b" text-anchor="middle">SOFTWARE DEVELOPER &amp; AI INNOVATOR</text>
  <line x1="340" y1="925" x2="460" y2="925" stroke="#590907" stroke-opacity="0.5" stroke-width="1" />
</svg>
